spring:
  application:
    name: mecanica-execution-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/execution}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${SERVER_PORT:8080}
BROKER_ENABLED: ${BROKER_ENABLED:false}
MONGODB_URI: ${MONGODB_URI:mongodb://localhost:27017/execution}
RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:os.exchange}
