apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mecanica-execution-service
  labels:
    app.kubernetes.io/name: mecanica-execution-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mecanica-execution-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: mecanica
      ports:
        - protocol: TCP
          port: 8080
