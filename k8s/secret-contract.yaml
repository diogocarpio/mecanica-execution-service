# Contrato dos Secrets usados pelo Deployment.
# Crie estes recursos por pipeline ou processo externo; não versione valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: execution-database
  namespace: mecanica-execution
type: Opaque
stringData:
  uri: "<MONGODB_URI>"
---
apiVersion: v1
kind: Secret
metadata:
  name: execution-rabbitmq
  namespace: mecanica-execution
type: Opaque
stringData:
  host: "<RABBITMQ_HOST>"
  username: "<RABBITMQ_USERNAME>"
  password: "<RABBITMQ_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: execution-newrelic
  namespace: mecanica-execution
type: Opaque
stringData:
  license-key: "<NEW_RELIC_LICENSE_KEY>"
