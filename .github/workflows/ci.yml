name: execution-service-ci-cd

on:
  push:
    branches: [main, develop, homologacao]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw
      - name: Run tests and coverage
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/classes

  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports
      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.exclusions=target/**,terraform/**

  docker-build:

    name: Build Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        id: image
        run: |
          docker build --tag "mecanica-execution-service:${{ github.sha }}" .
          echo "image-tag=mecanica-execution-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Save Docker image
        run: docker save "mecanica-execution-service:${{ github.sha }}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  docker-push:

    name: Push Docker Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < image.tar.gz
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and publish image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "mecanica-execution-service:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-push, sonar]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"
      - name: Load runtime secrets from AWS Secrets Manager
        env:
          RUNTIME_SECRET_ID: ${{ vars.RUNTIME_SECRET_ID }}
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > runtime-secrets.json
          for key in MONGODB_URI RABBITMQ_HOST RABBITMQ_USERNAME RABBITMQ_PASSWORD NEW_RELIC_LICENSE_KEY; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' runtime-secrets.json)"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Apply secrets and manifests
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}
          NAMESPACE: mecanica-execution-staging
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NAMESPACE" app.kubernetes.io/part-of=mecanica --overwrite
          kubectl -n "$NAMESPACE" create secret generic execution-database \
            --from-literal=uri="$MONGODB_URI" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic execution-rabbitmq \
            --from-literal=host="$RABBITMQ_HOST" \
            --from-literal=username="$RABBITMQ_USERNAME" \
            --from-literal=password="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic execution-newrelic \
            --from-literal=license-key="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl kustomize "k8s/overlays/staging" |
            sed "s#image: mecanica-execution-service:0.0.0#image: $IMAGE#g" |
            kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status deployment/mecanica-execution-service --timeout=180s
      - name: Remove runtime secret file
        if: always()
        run: rm -f runtime-secrets.json

  deploy-production:
    name: Promote production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"
      - name: Load runtime secrets from AWS Secrets Manager
        env:
          RUNTIME_SECRET_ID: ${{ vars.RUNTIME_SECRET_ID }}
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > runtime-secrets.json
          for key in MONGODB_URI RABBITMQ_HOST RABBITMQ_USERNAME RABBITMQ_PASSWORD NEW_RELIC_LICENSE_KEY; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' runtime-secrets.json)"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Apply secrets and manifests
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}
          NAMESPACE: mecanica-execution-production
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NAMESPACE" app.kubernetes.io/part-of=mecanica --overwrite
          kubectl -n "$NAMESPACE" create secret generic execution-database \
            --from-literal=uri="$MONGODB_URI" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic execution-rabbitmq \
            --from-literal=host="$RABBITMQ_HOST" \
            --from-literal=username="$RABBITMQ_USERNAME" \
            --from-literal=password="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic execution-newrelic \
            --from-literal=license-key="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl kustomize "k8s/overlays/production" |
            sed "s#image: mecanica-execution-service:0.0.0#image: $IMAGE#g" |
            kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status deployment/mecanica-execution-service --timeout=180s
      - name: Remove runtime secret file
        if: always()
        run: rm -f runtime-secrets.json
