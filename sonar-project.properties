# Configurações básicas do projeto
sonar.projectKey=diogocarpio_mecanica-execution-service
sonar.organization=diogocarpio
sonar.projectName=mecanica-execution-service
sonar.projectVersion=0.0.1-SNAPSHOT

# Configurações de código fonte
sonar.sources=src/main/java
sonar.sourceEncoding=UTF-8
sonar.language=java
sonar.java.source=17
sonar.java.binaries=target/classes

# Configurações de testes
sonar.tests=src/test/java
sonar.java.test.binaries=target/test-classes
sonar.java.test.libraries=target/test-classes

# Configurações de cobertura
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports

# Exclusões
sonar.exclusions=**/dto/**,**/model/**,**/config/**,**/ExecutionServiceApplication.java
